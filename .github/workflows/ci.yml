name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  extension-test:
    name: Headless MV3 extension test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # On GitHub's Ubuntu runners the apt chromium package is a snap stub;
      # snap itself works fine there.
      - name: Install Chromium
        run: sudo snap install chromium

      - name: Run MV3 extension test
        run: node test/mv3-extension.test.js
        env:
          CHROMIUM: /snap/bin/chromium

      # Skips itself when no I2P router answers on 127.0.0.1:4444 (always
      # the case on GitHub runners), so it never breaks CI.
      - name: Run live .i2p end-to-end test (skips without a router)
        run: node test/live-i2p-e2e.test.js
        env:
          CHROMIUM: /snap/bin/chromium

      # Same self-skip: exercises the Diagnostics panel only when a router
      # is reachable (e.g. self-hosted runners).
      - name: Run debug panel test (skips without a router)
        run: node test/debug-panel.test.js
        env:
          CHROMIUM: /snap/bin/chromium

  go-build:
    name: Launcher builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Build all launcher binaries
        run: |
          GOOS=windows go build -o i2pchromium.exe .
          GOOS=darwin  go build -o i2pchromium-darwin .
          GOOS=linux   go build -o i2pchromium .
